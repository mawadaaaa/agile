<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UMS MVP</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Auth Section -->
    <div id="auth-section" class="active-view">
        <div class="auth-box">
            <h2>Welcome to UMS</h2>
            <div class="tabs">
                <button id="tab-login" class="active-tab" onclick="switchAuthTab('login')">Login</button>
                <button id="tab-register" onclick="switchAuthTab('register')">Register</button>
            </div>
            
            <form id="login-form">
                <input type="text" id="login-user" placeholder="Username" required>
                <input type="password" id="login-pass" placeholder="Password" required>
                <button type="submit">Login</button>
            </form>

            <form id="register-form" style="display:none;">
                <input type="text" id="reg-user" placeholder="Username" required>
                <input type="password" id="reg-pass" placeholder="Password" required>
                <select id="reg-role">
                    <option value="student">Student</option>
                    <option value="admin">Admin</option>
                </select>
                <button type="submit">Register</button>
            </form>
            <div id="auth-error" class="error-msg"></div>
        </div>
    </div>

    <!-- App Section -->
    <div id="app-section" style="display:none;">
        <nav class="navbar">
            <div class="nav-brand">
                <span class="logo-icon">🎓</span>
                <h2>UMS <span id="current-user-role"></span></h2>
            </div>
            <div class="nav-links">
                <button onclick="showView('courses')">Course Catalog</button>
                <button id="nav-staff" onclick="showView('staff')" style="display:none;">Manage Staff</button>
                <button onclick="logout()" class="logout-btn">Logout</button>
            </div>
        </nav>

        <main class="content">
            <!-- Courses View -->
            <div id="courses-view" class="view">
                <div class="section-header">
                    <h3>Course Catalog</h3>
                    <p>Browse our selection of premium courses.</p>
                </div>

                <div id="admin-course-controls" class="admin-panel" style="display:none;">
                    <h4>➕ Add New Course</h4>
                    <div class="form-grid">
                        <input type="text" id="course-title" placeholder="Course Title">
                        <input type="text" id="course-icon" placeholder="Icon Emoji (e.g. 💻)">
                        <input type="text" id="course-desc" placeholder="Short Description">
                        <input type="text" id="course-instructor" placeholder="Instructor Name">
                        <input type="number" id="course-credits" placeholder="Credits (e.g. 3)" value="3">
                        <input type="text" id="course-schedule" placeholder="Schedule (e.g. Mon 10AM)">
                    </div>
                    <button onclick="addCourse()" class="add-btn">Add Course</button>
                </div>
                
                <div id="courses-grid" class="cards-grid"></div>
            </div>

            <!-- Staff View -->
            <div id="staff-view" class="view" style="display:none;">
                <div class="section-header">
                    <h3>Manage Staff Profiles</h3>
                </div>

                <div class="admin-panel">
                    <h4>➕ Add New Staff</h4>
                    <div class="form-grid">
                        <input type="text" id="staff-name" placeholder="Staff Name">
                        <input type="text" id="staff-role" placeholder="Role (e.g. Professor)">
                        <input type="text" id="staff-dept" placeholder="Department">
                    </div>
                    <button onclick="addStaff()" class="add-btn">Add Staff</button>
                </div>
                <ul id="staff-list" class="list"></ul>
            </div>
        </main>
    </div>

    <!-- Course Info Modal -->
    <div id="course-modal" class="modal-overlay" style="display:none;" onclick="closeModal(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <button class="close-modal" onclick="closeModal()">×</button>
            <div class="modal-header">
                <div id="modal-icon" class="modal-icon"></div>
                <h2 id="modal-title"></h2>
            </div>
            <div class="modal-body">
                <p id="modal-desc" class="modal-desc"></p>
                <div class="modal-info-grid">
                    <div class="info-item">
                        <strong>Instructor</strong>
                        <span id="modal-instructor"></span>
                    </div>
                    <div class="info-item">
                        <strong>Credits</strong>
                        <span id="modal-credits"></span>
                    </div>
                    <div class="info-item">
                        <strong>Schedule</strong>
                        <span id="modal-schedule"></span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
